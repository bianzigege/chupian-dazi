<meta property="og:description" content="曼谷机位卡、举起手机看构图、挑图写文案。阿里云百炼 + 飞猪真实商品。">

<style>
/* Same travel-journal look as 开口泰 / 安心游: cream paper, flag navy + red, temple gold, watercolour stickers. */
:root {
  --bg: #F6EDDC; --surface: #FFFBF3; --sunk: #EFE3CC; --ink: #1E2350; --muted: #776F62; --line: #E5D6BC;
  --accent: #C5283D; --accent-soft: #FBE4DF; --primary: #1E2350; --on-primary: #FFF6E6;
  --gold: #D99A1E; --gold-soft: #F8E7C2; --leaf: #3D8A4F; --leaf-soft: #DCEBD6; --on-accent: #FFFFFF;
  --shadow: 0 1px 0 var(--line), 0 6px 14px -8px rgba(80,55,20,.28);
  --f-display: "Mitr", "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
  --f-body: "Sarabun", "PingFang SC", "Noto Sans SC", "Microsoft YaHei", system-ui, sans-serif;
  --f-thai: "Sarabun", "Thonburi", "Noto Sans Thai", sans-serif;
  --f-hand: "Caveat", "Mitr", cursive;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #14162E; --surface: #1D2043; --sunk: #262A52; --ink: #F5EBD8; --muted: #A9A6C2; --line: #33376A;
    --accent: #FF6B7D; --accent-soft: #3B1F3A; --primary: #F2B544; --on-primary: #14162E; --gold: #F2B544; --gold-soft: #3A3350;
    --leaf: #6CCB86; --leaf-soft: #1C3A33; --on-accent: #14162E;
    --shadow: 0 1px 0 rgba(0,0,0,.25), 0 8px 18px -10px rgba(0,0,0,.6); color-scheme: dark;
  }
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.55; -webkit-tap-highlight-color: transparent; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible, textarea:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
a { color: inherit; }
h1, h2, h3, h4 { font-family: var(--f-display); font-weight: 500; line-height: 1.25; text-wrap: balance; margin: 0; }
p { margin: 0; }
.flag { height: 6px; background: linear-gradient(#A51931 0 16.6%, #F4F5F8 0 33.3%, #2D2A4A 0 66.6%, #F4F5F8 0 83.3%, #A51931 0); }
.wrap { max-width: 720px; margin: 0 auto; padding: 16px 16px 96px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; text-decoration: none; }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-weight: 600; }
.btn.navy { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.btn.big { padding: 12px 20px; font-size: 16px; }
.btn:disabled { opacity: .5; cursor: default; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 8px; border: 1.5px dashed var(--line); background: var(--surface); font-size: 13px; color: var(--muted); }
.err { font-size: 14px; padding: 10px 12px; border-radius: 10px; background: var(--accent-soft); color: var(--accent); }
.stk { display: block; pointer-events: none; user-select: none; filter: drop-shadow(0 3px 4px rgba(60,40,10,.2)); }

.hero { position: relative; padding: 22px 18px 20px; border-radius: 20px; background: var(--primary); color: var(--on-primary); overflow: hidden; }
.hero h1 { font-size: clamp(30px, 9vw, 42px); }
.hero .slogan { font-family: var(--f-hand); font-size: 24px; color: var(--gold); transform: rotate(-3deg); display: inline-block; margin-top: 6px; }
.hero p { margin-top: 10px; max-width: 30em; opacity: .92; }
.hero .stk { position: absolute; right: 6px; top: 8px; width: 84px; transform: rotate(10deg); }
.steps { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.step { background: var(--surface); border-radius: 14px; padding: 12px 10px; box-shadow: var(--shadow); font-size: 13px; color: var(--muted); }
.step b { display: block; font-family: var(--f-display); font-weight: 500; font-size: 15px; color: var(--ink); }
.step i { font-style: normal; font-family: var(--f-hand); font-size: 22px; color: var(--accent); line-height: 1; }
.sec h2 { font-size: 20px; margin-bottom: 10px; }
.spots { display: grid; gap: 12px; }
.spot { position: relative; display: grid; gap: 4px; padding: 14px 76px 14px 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); text-decoration: none; }
.spot h3 { font-size: 18px; } .spot .th { font-family: var(--f-thai); color: var(--muted); font-size: 14px; margin-left: 6px; }
.spot p { font-size: 14px; color: var(--muted); }
.spot .stk { position: absolute; right: 10px; top: 50%; width: 54px; transform: translateY(-50%) rotate(6deg); }
.spot .dist { font-size: 13px; color: var(--leaf); font-weight: 600; }
.geo { display: grid; gap: 8px; padding: 14px 16px; border-radius: 16px; background: var(--gold-soft); }
.tool { display: grid; gap: 4px; padding: 14px 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); text-decoration: none; }
.tool b { font-family: var(--f-display); font-weight: 500; font-size: 17px; }

.topbar { position: sticky; top: 0; z-index: 5; background: var(--bg); display: flex; align-items: center; gap: 8px; padding: 8px 16px; margin: -16px -16px 0; border-bottom: 1px solid var(--line); }
.topbar h2 { font-size: 18px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topbar .back { text-decoration: none; padding: 6px 10px 6px 0; white-space: nowrap; }
.rules { display: grid; gap: 6px; padding: 12px 14px; border-radius: 14px; background: var(--accent-soft); font-size: 14px; }
.rules b { color: var(--accent); }
.rules ul { margin: 0; padding-left: 18px; display: grid; gap: 2px; }
.cardx { display: grid; gap: 8px; padding: 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.cardx h3 { font-size: 18px; display: flex; gap: 8px; align-items: baseline; }
.cardx h3 i { font-style: normal; font-family: var(--f-hand); font-size: 24px; color: var(--accent); }
.kv { display: grid; grid-template-columns: 3.2em minmax(0, 1fr); gap: 4px 10px; font-size: 15px; margin: 0; }
.kv dt { color: var(--muted); font-size: 13px; padding-top: 2px; } .kv dd { margin: 0; }
.frame { position: relative; aspect-ratio: 4 / 3; border-radius: 10px; background: var(--sunk); overflow: hidden; }
.shop { display: grid; gap: 8px; }
.shop a { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); text-decoration: none; font-size: 14px; }
.shop img { width: 52px; height: 52px; border-radius: 8px; object-fit: cover; flex: none; background: var(--sunk); }
.shop .t { min-width: 0; display: grid; } .shop .t span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; } .shop .t span.small { white-space: normal; }
.shop .go { margin-left: auto; color: var(--accent); white-space: nowrap; font-weight: 600; }

/* viewfinder */
.cam { position: relative; border-radius: 16px; overflow: hidden; background: #111; aspect-ratio: 3 / 4; max-height: 62vh; margin-inline: auto; width: 100%; }
.cam video, .cam img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cam .grid { position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(to right, transparent 33.2%, rgba(255,255,255,.45) 33.2% 33.5%, transparent 33.5% 66.5%, rgba(255,255,255,.45) 66.5% 66.8%, transparent 66.8%),
              linear-gradient(to bottom, transparent 33.2%, rgba(255,255,255,.45) 33.2% 33.5%, transparent 33.5% 66.5%, rgba(255,255,255,.45) 66.5% 66.8%, transparent 66.8%); }
.cam .brief { position: absolute; left: 8px; right: 8px; top: 8px; padding: 8px 10px; border-radius: 10px; background: rgba(20,22,46,.72); color: #FFF6E6; font-size: 13px; }
.cam .busy { position: absolute; inset: 0; display: grid; place-items: center; background: rgba(20,22,46,.45); color: #fff; font-size: 16px; }
.advice { display: grid; gap: 10px; padding: 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.advice.ok { background: var(--leaf-soft); }
.dots { display: inline-flex; gap: 4px; vertical-align: middle; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: var(--line); } .dots i.on { background: var(--gold); }
.moves { margin: 0; padding-left: 20px; display: grid; gap: 4px; font-size: 17px; font-weight: 600; }
.advice .rule { color: var(--accent); font-weight: 600; }

/* pick */
.thumbs { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.thumbs figure { position: relative; margin: 0; aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--sunk); }
.thumbs img { width: 100%; height: 100%; object-fit: cover; display: block; }
.thumbs .n { position: absolute; left: 4px; top: 4px; min-width: 22px; height: 22px; padding: 0 6px; border-radius: 11px; background: rgba(20,22,46,.7); color: #fff; font-size: 13px; display: grid; place-items: center; }
.thumbs .rk { position: absolute; right: 4px; top: 4px; padding: 1px 8px; border-radius: 999px; background: var(--accent); color: var(--on-accent); font-size: 13px; font-weight: 600; }
.thumbs figure.dim img { opacity: .45; }
.picks { display: grid; gap: 10px; }
.pk { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 12px; align-items: center; padding: 10px; border-radius: 14px; background: var(--surface); box-shadow: var(--shadow); }
.pk img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; }
.pk b { font-family: var(--f-display); font-weight: 500; }
.pk .bad { color: var(--accent); font-size: 14px; }
.copy { display: grid; gap: 8px; padding: 14px 16px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow); }
.copy .title { display: flex; gap: 8px; align-items: center; justify-content: space-between; padding: 8px 0; border-bottom: 1px dashed var(--line); font-weight: 600; }
.copy .body { white-space: pre-wrap; }
.copy .tags { color: var(--primary); overflow-wrap: anywhere; }
textarea, select { font: inherit; color: inherit; width: 100%; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
.privacy { font-size: 13px; color: var(--muted); }
.modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; background: var(--bg); padding: 20px 20px calc(20px + env(safe-area-inset-bottom, 0px)); overflow: auto; }
.modal .inner { width: 100%; max-width: 560px; display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.modal .x { position: fixed; top: calc(10px + env(safe-area-inset-top, 0px)); right: 12px; border: 0; background: var(--surface); border-radius: 50%; width: 44px; height: 44px; font-size: 22px; box-shadow: var(--shadow); }
.modal .alert-k { justify-self: start; font-size: 15px; font-weight: 600; color: var(--on-accent); background: var(--accent); padding: 4px 14px; border-radius: 999px; }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 40; padding: 8px 16px; border-radius: 999px; background: var(--primary); color: var(--on-primary); font-size: 14px; }
@media (prefers-reduced-motion: no-preference) { .btn, .spot, .tool { transition: transform .12s; } .btn:active, .spot:active, .tool:active { transform: scale(.98); } }
</style>
<div class="flag"></div>
<main class="wrap" id="app"></main>
<script>
(() => {
  const $ = (s, r = document) => r.querySelector(s);
  const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const app = $("#app");
  const IN_WX = /MicroMessenger/i.test(navigator.userAgent);
  let UID = "";
  try { UID = localStorage.getItem("kaikou-pian-uid") || ""; if (!UID) { UID = Math.random().toString(36).slice(2) + Date.now().toString(36); localStorage.setItem("kaikou-pian-uid", UID); } } catch (e) { UID = "anon"; }
  function track(ev, k, ok) {
    if (location.protocol !== "https:") return;
    try { navigator.sendBeacon("/api/e", new Blob([JSON.stringify({ ev, k, ok, uid: UID, role: "pian" })], { type: "application/json" })); } catch (e) {}
  }
  async function post(url, body) {
    let r;
    try { r = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) }); }
    catch (e) { throw new Error(navigator.onLine === false ? "现在没网，这个功能要联网才能用" : "网络有点问题，再试一次"); }
    const j = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(j.error || "网络有点问题，再试一次");
    return j;
  }
  const sticker = name => `<img class="stk" src="img/stk/${name}.webp" alt="" aria-hidden="true" decoding="async">`;
  function toast(t) { const o = $(".toast"); if (o) o.remove(); const el = document.createElement("div"); el.className = "toast"; el.setAttribute("role", "status"); el.textContent = t; document.body.appendChild(el); setTimeout(() => el.remove(), 1800); }
  async function copyText(t) {
    try { await navigator.clipboard.writeText(t); }
    catch (e) { const ta = document.createElement("textarea"); ta.value = t; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); } catch (er) {} ta.remove(); }
    toast("已复制"); track("pian_copy");
  }
  function modal(html) {
    closeModal();
    const m = document.createElement("div");
    m.className = "modal"; m.setAttribute("role", "dialog"); m.setAttribute("aria-modal", "true");
    m.innerHTML = `<button class="x" data-act="close" aria-label="关闭">×</button><div class="inner">${html}</div>`;
    document.body.appendChild(m); document.body.style.overflow = "hidden"; m.querySelector(".x").focus();
  }
  function closeModal() { const m = $(".modal"); if (m) m.remove(); document.body.style.overflow = ""; }

  // ---------- data ----------
  let D = null, FZ = null;           // spots; 飞猪 snapshot (Bangkok)
  const UI = { err: null, pos: null, geoOn: false, look: null, lookBusy: false, lookErr: null, shot: null, picks: [], pickBusy: false, pickErr: null, pick: null, note: "", pickSpot: "" };
  const spotOf = id => D.spots.find(s => s.id === id);
  const dist = (a, b) => { const R = 6371000, r = x => x * Math.PI / 180, dφ = r(b.lat - a.lat), dλ = r(b.lng - a.lng); const h = Math.sin(dφ / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dλ / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };
  const fmtDist = m => m < 1000 ? `${Math.round(m / 10) * 10} 米` : `${(m / 1000).toFixed(1)} 公里`;
  function fz(id) {
    if (!FZ || !id) return null;
    return FZ.pois.find(x => x.id === id) || FZ.products.find(x => x.id === id) || FZ.hotels.find(x => x.id === id) || null;
  }
  // Images go to the API as JPEG data URLs; phones shoot 12 MP, the model needs far less.
  function shrink(src, max, q) {
    return new Promise((res, rej) => {
      const img = new Image(), url = src instanceof Blob ? URL.createObjectURL(src) : src;
      img.onload = () => {
        const k = Math.min(1, max / Math.max(img.width, img.height));
        const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
        c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
        if (src instanceof Blob) URL.revokeObjectURL(url);
        res(c.toDataURL("image/jpeg", q));
      };
      img.onerror = () => rej(new Error("这张图打不开，换一张试试"));
      img.src = url;
    });
  }

  // ---------- views ----------
  function viewHome() {
    const spots = [...D.spots];
    if (UI.pos) spots.sort((a, b) => dist(UI.pos, a) - dist(UI.pos, b));
    return `
      <header class="hero">
        ${sticker("camera")}
        <h1>出片搭子</h1>
        <span class="slogan">到了就知道怎么拍</span>
        <p>站哪、拍什么、几点光线好，先给你看。举起手机帮你看构图，拍完帮你挑图、写小红书文案。</p>
      </header>
      ${IN_WX ? `<div class="err">微信里相机和定位可能用不了：点右上角「···」→「在浏览器打开」。</div>` : ""}
      <div class="steps">
        <div class="step"><i>1</i><b>看机位卡</b>去之前知道拍哪几张</div>
        <div class="step"><i>2</i><b>举手机</b>AI 看着画面告诉你怎么挪</div>
        <div class="step"><i>3</i><b>挑图文案</b>选出 3 张，文案直接复制</div>
      </div>
      <section class="geo">
        <b>走到机位附近提醒我</b>
        <p class="small">开着这个页面，走到下面这些地方附近，会弹出这里的机位卡和拍照规矩。</p>
        <div class="row">
          <button class="btn navy" data-act="geo">${UI.geoOn ? "提醒已开启 ✓" : "开启提醒"}</button>
          <button class="btn" data-act="geodemo">演示：模拟走到郑王庙</button>
        </div>
        ${UI.err ? `<div class="err">${esc(UI.err)}</div>` : ""}
      </section>
      <section class="sec">
        <h2>曼谷 · ${D.spots.length} 个出片地点${UI.pos ? "（按离你远近排）" : ""}</h2>
        <div class="spots">${spots.map(s => `
          <a class="spot" href="#/spot/${s.id}">
            ${sticker(s.stk)}
            <h3>${esc(s.name)}<span class="th">${esc(s.th)}</span></h3>
            <p>${esc(s.why)}</p>
            <span class="row"><span class="chip">${s.cards.length} 个机位</span>${UI.pos ? `<span class="dist">离你 ${fmtDist(dist(UI.pos, s))}</span>` : ""}</span>
          </a>`).join("")}</div>
      </section>
      <a class="tool" href="#/pick"><b>已经拍完了？挑图 + 写文案 ›</b><span class="muted small">选 2–9 张照片，AI 挑出最该发的 3 张，写好标题、正文和话题。</span></a>
      <a class="tool" href="trip"><b>还没订行程？安心游泰国 ›</b><span class="muted small">飞猪真实行程，每一站的泰语和防坑提醒。</span></a>
      <p class="privacy"><b>说明</b>：机位和规矩是作者在曼谷整理的，不写开放时间和票价，以现场和飞猪页面为准。看构图、挑图时，照片会发给阿里云百炼处理，用完就丢，我们不保存；定位只在你的手机上计算。为防止被刷，服务器只记 IP 和调用次数。</p>`;
  }

  function shopHTML(s) {
    const items = [];
    const poi = fz(s.poi); if (poi) items.push({ t: poi.name, sub: poi.rank || poi.cat || "景点", pic: poi.pic, url: poi.url });
    for (const id of s.refs || []) { const p = fz(id); if (p) items.push({ t: p.title, sub: { ticket: "门票", tour: "一日游", boat: "游船", transfer: "接送" }[p.kind] || "玩乐", pic: p.pic, url: p.url }); }
    if (FZ) {
      const near = FZ.hotels.filter(h => h.lat && h.lng).map(h => ({ h, d: dist(s, { lat: +h.lat, lng: +h.lng }) })).sort((a, b) => a.d - b.d).slice(0, 2);
      for (const { h, d } of near) items.push({ t: h.name, sub: `酒店 · 离这里 ${fmtDist(d)}${h.price && h.price !== "None" ? ` · 参考价 ${h.price} 起` : ""}`, pic: h.pic, url: h.url });
    }
    if (!items.length) return "";
    return `<section class="sec"><h2>在飞猪订</h2>
      <div class="shop">${items.map(x => `<a href="${esc(x.url)}" target="_blank" rel="noopener">
        ${x.pic ? `<img src="${esc(x.pic)}" alt="" loading="lazy" referrerpolicy="no-referrer">` : ""}
        <span class="t"><span>${esc(x.t)}</span><span class="muted small">${esc(x.sub)}</span></span><span class="go">去看看 ›</span></a>`).join("")}</div>
      <p class="muted small" style="margin-top:8px">飞猪数据 ${esc(FZ.fetchedAt)} 采集，价格和库存以飞猪页面为准。</p></section>`;
  }

  function viewSpot(id) {
    const s = spotOf(id);
    if (!s) return `<div class="topbar"><a class="back" href="#/">‹ 首页</a><h2>没找到这个地点</h2></div>`;
    return `
      <div class="topbar"><a class="back" href="#/">‹ 首页</a><h2>${esc(s.name)}</h2></div>
      <p>${esc(s.why)}</p>
      <div class="rules"><b>在这里拍照的规矩</b><ul>${[...s.rules, ...D.common_rules].map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>
      ${s.cards.map((c, i) => `
        <article class="cardx">
          <h3><i>${i + 1}</i>${esc(c.t)}</h3>
          <dl class="kv">
            <dt>站哪</dt><dd>${esc(c.where)}</dd>
            <dt>怎么拍</dt><dd>${esc(c.shot)}</dd>
            <dt>几点</dt><dd>${esc(c.time)}</dd>
            <dt>姿势</dt><dd>${esc(c.pose)}</dd>
          </dl>
          <div class="row"><a class="btn primary" href="#/look/${s.id}/${i}">举起手机，帮我看构图</a></div>
        </article>`).join("")}
      ${shopHTML(s)}
      <a class="tool" href="#/pick"><b>拍完了？挑图 + 写文案 ›</b><span class="muted small">选 2–9 张，AI 挑出 3 张，写好小红书文案。</span></a>`;
  }

  function adviceHTML() {
    const a = UI.look;
    if (UI.lookErr) return `<div class="err">${esc(UI.lookErr)}</div>`;
    if (!a) return `<p class="muted">对准想拍的画面，按「帮我看看」。AI 只根据画面说话，告诉你下一步怎么挪。</p>`;
    return `<div class="advice ${a.ok ? "ok" : ""}" aria-live="polite">
      <div><span class="dots" aria-label="${a.score} 分，满分 5 分">${[1, 2, 3, 4, 5].map(i => `<i class="${i <= a.score ? "on" : ""}"></i>`).join("")}</span>
        <b style="margin-left:8px">${a.ok ? "可以按快门了" : "再调一下"}</b></div>
      ${a.see ? `<p class="muted small">我看到：${esc(a.see)}</p>` : ""}
      ${a.moves.length ? `${a.ok ? `<p class="muted small">想更好还可以：</p>` : ""}<ol class="moves">${a.moves.map(m => `<li>${esc(m)}</li>`).join("")}</ol>` : ""}
      ${a.pose ? `<p>人的姿势：${esc(a.pose)}</p>` : ""}
      ${a.rule ? `<p class="rule">注意：${esc(a.rule)}</p>` : ""}
    </div>`;
  }
  function viewLook(id, ci) {
    const s = spotOf(id), c = s && s.cards[+ci];
    return `
      <div class="topbar"><a class="back" href="${s ? `#/spot/${s.id}` : "#/"}">‹ ${s ? esc(s.name) : "首页"}</a><h2>${c ? esc(c.t) : "看构图"}</h2></div>
      <div class="cam">
        <video id="vf" playsinline muted autoplay ${UI.shot ? "hidden" : ""}></video>
        ${UI.shot ? `<img src="${UI.shot}" alt="刚才那一帧">` : ""}
        <div class="grid"></div>
        ${c ? `<div class="brief">${esc(c.shot)}</div>` : ""}
        ${UI.lookBusy ? `<div class="busy">正在看画面…</div>` : ""}
      </div>
      <div class="row" style="justify-content:center">
        <button class="btn primary big" data-act="look" ${UI.lookBusy ? "disabled" : ""}>${UI.shot ? "再看一次" : "帮我看看"}</button>
        <label class="btn"><input type="file" id="lookfile" accept="image/*" capture="environment" hidden>用相册 / 系统相机</label>
      </div>
      <div id="advice">${adviceHTML()}</div>
      <p class="muted small">由阿里云百炼 qwen3-vl-plus 看画面。它只看得到你这一帧，现场以你自己的眼睛为准。</p>`;
  }

  function viewPick() {
    const r = UI.pick, n = UI.picks.length;
    const rank = i => r ? r.top.indexOf(i + 1) : -1;
    return `
      <div class="topbar"><a class="back" href="#/">‹ 首页</a><h2>挑图 + 写文案</h2></div>
      <p class="muted">选 2–9 张同一趟拍的照片。AI 先看每张拍到了什么、哪里有问题，挑出最该发的 3 张并排好顺序，再只用照片里看得到的内容写文案。</p>
      <div class="row">
        <label class="btn primary big"><input type="file" id="pickfile" accept="image/*" multiple hidden>${n ? "重新选照片" : "选照片"}</label>
        ${n ? `<span class="chip">已选 ${n} 张</span>` : ""}
      </div>
      ${n ? `<div class="thumbs">${UI.picks.map((u, i) => `<figure class="${r && rank(i) < 0 ? "dim" : ""}"><img src="${u}" alt="第 ${i + 1} 张"><span class="n">${i + 1}</span>${rank(i) >= 0 ? `<span class="rk">${rank(i) === 0 ? "封面" : "第 " + (rank(i) + 1) + " 张"}</span>` : ""}</figure>`).join("")}</div>
        <label class="small muted" for="pspot">在哪拍的</label>
        <select id="pspot"><option value="">不在列表里</option>${D.spots.map(s => `<option value="${s.id}" ${UI.pickSpot === s.id ? "selected" : ""}>${esc(s.name)}</option>`).join("")}</select>
        <label class="small muted" for="pnote">想在文案里提的一句话（可不填）</label>
        <textarea id="pnote" rows="2" maxlength="80" placeholder="比如：下午四点到的，人不多，租了泰服">${esc(UI.note)}</textarea>
        <div class="row"><button class="btn navy big" data-act="pick" ${UI.pickBusy || n < 2 ? "disabled" : ""}>${UI.pickBusy ? "正在看照片…约 20 秒" : r ? "重新挑一次" : "帮我挑图写文案"}</button></div>` : ""}
      ${UI.pickErr ? `<div class="err">${esc(UI.pickErr)}</div>` : ""}
      ${r ? `
        <section class="sec"><h2>发这 ${r.top.length} 张</h2>
          <div class="picks">${r.top.map((i, k) => { const p = r.photos.find(x => x.i === i) || {}; return `<div class="pk"><img src="${UI.picks[i - 1]}" alt=""><div><b>${k === 0 ? "封面" : "第 " + (k + 1) + " 张"} · 原第 ${i} 张</b><p>${esc(p.what || "")}</p><p class="muted small">${esc(k === 0 && r.cover_why ? r.cover_why : p.good || "")}</p></div></div>`; }).join("")}</div>
          ${r.photos.filter(p => !r.top.includes(p.i) && p.bad).length ? `<p class="muted small" style="margin-top:10px">没选的：${r.photos.filter(p => !r.top.includes(p.i) && p.bad).map(p => `第 ${p.i} 张（${esc(p.bad)}）`).join("；")}</p>` : ""}
        </section>
        <section class="sec"><h2>文案</h2>
          <div class="copy">
            ${r.titles.map((t, i) => `<div class="title"><span>${esc(t)}</span><button class="btn" data-act="copy" data-k="t${i}">复制</button></div>`).join("")}
            <p class="body">${esc(r.body)}</p>
            <p class="tags">${r.tags.map(t => "#" + esc(t)).join(" ")}</p>
            <div class="row"><button class="btn primary" data-act="copy" data-k="all">复制正文 + 话题</button></div>
            <p class="muted small">AI 生成，只用了照片内容、地点说明和你填的那句话。发之前自己读一遍，价格和时间自己补。</p>
          </div>
        </section>` : ""}`;
  }

  // ---------- router ----------
  let view = "home", args = [];
  function render() {
    const h = location.hash.replace(/^#\/?/, "").split("/").filter(Boolean);
    view = h[0] || "home"; args = h.slice(1);
    if (view !== "look") stopCam();
    app.innerHTML = view === "spot" ? viewSpot(args[0]) : view === "look" ? viewLook(args[0], args[1]) : view === "pick" ? viewPick() : viewHome();
    if (view === "look" && !UI.shot) startCam();
  }
  addEventListener("hashchange", () => { UI.look = null; UI.lookErr = null; UI.shot = null; closeModal(); render(); scrollTo(0, 0); });

  // ---------- camera ----------
  let CAM = null;
  async function startCam() {
    const v = $("#vf"); if (!v) return;
    try {
      if (!CAM) CAM = await navigator.mediaDevices.getUserMedia({ video: { facingMode: { ideal: "environment" }, width: { ideal: 1280 } }, audio: false });
      v.srcObject = CAM; await v.play().catch(() => {});
    } catch (e) {
      UI.lookErr = IN_WX ? "微信里打不开相机：点右上角「···」→「在浏览器打开」，或者用下面的「用相册 / 系统相机」。" : "相机没打开。可以在浏览器设置里允许相机，或者用下面的「用相册 / 系统相机」。";
      const a = $("#advice"); if (a) a.innerHTML = adviceHTML();
    }
  }
  function stopCam() { if (CAM) { CAM.getTracks().forEach(t => t.stop()); CAM = null; } }
  function grab() {
    const v = $("#vf"); if (!v || !v.videoWidth) return null;
    const k = Math.min(1, 960 / Math.max(v.videoWidth, v.videoHeight));
    const c = document.createElement("canvas"); c.width = Math.round(v.videoWidth * k); c.height = Math.round(v.videoHeight * k);
    c.getContext("2d").drawImage(v, 0, 0, c.width, c.height);
    return c.toDataURL("image/jpeg", .8);
  }
  async function look(image) {
    if (UI.lookBusy) return;
    UI.lookBusy = true; UI.lookErr = null; UI.look = null; UI.shot = image; render();
    try { UI.look = await post("/api/pian/look", { image, spot: args[0] || "", card: Number.isInteger(+args[1]) ? +args[1] : -1 }); track("pian_look", args[0], true); }
    catch (e) { UI.lookErr = e.message; track("pian_look", args[0], false); }
    UI.lookBusy = false; UI.shot = image; render();
    const a = $("#advice"); if (a) a.scrollIntoView({ block: "nearest", behavior: "smooth" });
  }

  // ---------- geofence ----------
  const GEO = { id: null, seen: {} };
  function alertSpot(s, demo) {
    track("pian_alert", s.id);
    modal(`<span class="alert-k">${demo ? "演示 · " : ""}你到了「${esc(s.name)}」附近</span>
      <h2>这里有 ${s.cards.length} 个机位</h2>
      <div class="rules"><b>先看规矩</b><ul>${s.rules.map(r => `<li>${esc(r)}</li>`).join("")}</ul></div>
      ${s.cards.map((c, i) => `<div class="cardx"><h3><i>${i + 1}</i>${esc(c.t)}</h3><p>${esc(c.where)}</p><p class="muted small">${esc(c.time)}</p></div>`).join("")}
      <div class="row"><a class="btn primary big" href="#/spot/${s.id}">看完整机位卡</a><button class="btn" data-act="close">知道了</button></div>`);
  }
  function onPos(p) {
    UI.pos = { lat: p.coords.latitude, lng: p.coords.longitude };
    const hit = D.spots.map(s => ({ s, d: dist(UI.pos, s) })).filter(x => x.d <= x.s.radius).sort((a, b) => a.d - b.d)[0];
    // One alert per spot every 6 hours: walking around the temple must not re-open it.
    let seen = {}; try { seen = JSON.parse(localStorage.getItem("kaikou-pian-seen") || "{}"); } catch (e) {}
    if (hit && !$(".modal") && !(Date.now() - (seen[hit.s.id] || 0) < 6 * 3600e3)) {
      seen[hit.s.id] = Date.now(); try { localStorage.setItem("kaikou-pian-seen", JSON.stringify(seen)); } catch (e) {}
      alertSpot(hit.s, false);
    }
    if (view === "home" && !$(".modal")) render();
  }
  function geoOn() {
    if (!navigator.geolocation) { UI.err = "这个浏览器不支持定位"; render(); return; }
    UI.geoOn = true; UI.err = null; render();
    if (GEO.id == null) GEO.id = navigator.geolocation.watchPosition(onPos, e => {
      // Only a refusal turns the reminder off; a timeout indoors just means "try again".
      if (e.code === 1) { UI.geoOn = false; UI.err = IN_WX ? "微信里用不了定位：点右上角「···」→「在浏览器打开」" : "需要定位权限：请在浏览器设置里允许这个网站使用定位"; navigator.geolocation.clearWatch(GEO.id); GEO.id = null; render(); }
    }, { enableHighAccuracy: true, maximumAge: 20000, timeout: 20000 });
  }

  // ---------- events ----------
  document.addEventListener("click", async e => {
    const b = e.target.closest("[data-act]"); if (!b) return;
    const act = b.dataset.act;
    if (act === "close") { closeModal(); return; }
    if (act === "geo") { geoOn(); return; }
    if (act === "geodemo") { alertSpot(spotOf("arun"), true); return; }
    if (act === "look") {
      if (UI.shot) { UI.shot = null; UI.look = null; UI.lookErr = null; render(); return; }   // back to the live viewfinder
      const img = grab();
      if (!img) { UI.lookErr = "相机画面还没出来。等一秒再按，或者用「用相册 / 系统相机」。"; $("#advice").innerHTML = adviceHTML(); return; }
      look(img); return;
    }
    if (act === "pick") {
      if (UI.pickBusy || UI.picks.length < 2) return;
      UI.note = ($("#pnote") || {}).value || ""; UI.pickSpot = ($("#pspot") || {}).value || "";
      UI.pickBusy = true; UI.pickErr = null; render();
      try { UI.pick = await post("/api/pian/pick", { images: UI.picks, spot: UI.pickSpot, note: UI.note }); track("pian_pick", UI.pickSpot, true); }
      catch (er) { UI.pickErr = er.message; track("pian_pick", UI.pickSpot, false); }
      UI.pickBusy = false; render();
      const h = $(".picks"); if (h) h.scrollIntoView({ block: "start", behavior: "smooth" });
      return;
    }
    if (act === "copy" && UI.pick) {
      const k = b.dataset.k;
      copyText(k === "all" ? UI.pick.body + "\n\n" + UI.pick.tags.map(t => "#" + t).join(" ") : UI.pick.titles[+k.slice(1)] || "");
    }
  });
  document.addEventListener("change", async e => {
    const el = e.target;
    if (el.id === "lookfile" && el.files[0]) { try { look(await shrink(el.files[0], 960, .8)); } catch (er) { UI.lookErr = er.message; render(); } }
    if (el.id === "pickfile" && el.files.length) {
      const files = [...el.files].slice(0, 9);
      UI.pick = null; UI.pickErr = el.files.length > 9 ? "最多 9 张，只取了前 9 张" : null;
      try { UI.picks = await Promise.all(files.map(f => shrink(f, 768, .72))); } catch (er) { UI.pickErr = er.message; UI.picks = []; }
      render();
    }
    if (el.id === "pspot") UI.pickSpot = el.value;
  });
  document.addEventListener("input", e => { if (e.target.id === "pnote") UI.note = e.target.value; });
  document.addEventListener("keydown", e => { if (e.key === "Escape") closeModal(); });

  // ---------- boot ----------
  (async () => {
    try { D = await fetch("data/pian/spots.json").then(r => r.json()); }
    catch (e) { app.innerHTML = `<div class="err">数据没加载出来，检查网络后刷新一下。</div>`; return; }
    render(); track("pian_open");
    // 飞猪 snapshot is only needed for the booking links; the cards work without it.
    try { FZ = await fetch("data/trip/bkk.json").then(r => r.json()); if (view === "spot") render(); } catch (e) {}
  })();
})();
</script>
